<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RWX prototype</title>
<link rel="stylesheet" href="../../../frontend/src/theme.css">
<style>
/* ===== Colour tokens come from frontend/src/theme.css (linked above) ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-sm:8px; --r-md:12px; --r-card:16px; --r-sheet:24px; --r-pill:999px;
  --ease:cubic-bezier(.32,.72,0,1);
}
/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/20px var(--font);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:500px){body{background:#8884}.app{margin-top:16px;height:min(880px,calc(100dvh - 32px));border-radius:44px;box-shadow:0 0 0 10px #111,0 20px 60px #0006}}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) 0 calc(49px + env(safe-area-inset-bottom) + 88px)}
/* header */
.title-row{display:flex;align-items:baseline;gap:10px;padding:12px 16px 4px}
.title-row h1{margin:0;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.4px}
.count{font-size:15px;color:var(--text-2);font-variant-numeric:tabular-nums}
.tools{position:sticky;top:0;z-index:5;display:flex;gap:4px;align-items:center;padding:6px 8px 8px 16px;background:var(--bg)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:var(--r-md);background:var(--surface-2);color:var(--text-2)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--text);font:16px var(--font);outline:none}
.search input::placeholder{color:var(--text-2)}
.ibtn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-md);color:var(--text)}
.ibtn:active{background:var(--surface-2)}
.ibtn .badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:18px;font-weight:600;text-align:center}
.ibtn.on svg{fill:var(--accent-soft);stroke:var(--accent)}
.seg{display:flex;margin:0 16px 8px;padding:2px;border-radius:10px;background:var(--surface-2)}
.seg button{flex:1;height:40px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-2);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0003;font-weight:600}
/* banners */
.banner{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:10px 12px;border-radius:var(--r-md);font-size:14px;line-height:19px}
.banner b{font-weight:600}.banner .grow{flex:1;min-width:0}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--planned-bg);color:var(--planned)}
.banner.err{background:var(--danger-bg);color:var(--danger)}
.banner .btn-s{min-height:44px;padding:0 10px;margin:-8px -6px -8px 0;font-weight:600;text-decoration:underline}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* list + cards */
.list{display:flex;flex-direction:column;gap:10px;padding:4px 16px 0}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-card);transition:opacity var(--d,.22s),transform .22s}
.swipe::-webkit-scrollbar{display:none}
.swipe.gone{opacity:0;transform:scale(.97)}
.card{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:80px 1fr 44px;gap:10px;padding:10px;background:var(--surface);border-radius:var(--r-card)}
.del{flex:0 0 92px;scroll-snap-align:end;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--danger);color:#fff;font-size:13px;font-weight:600;margin-left:8px;border-radius:var(--r-card)}
:root[data-theme=dark] .del{color:#2a0707}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .del{color:#2a0707}}
.cover{position:relative;width:80px;height:108px;border-radius:var(--r-sm);overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px;text-shadow:0 1px 2px #0006}
.cover.sm{width:60px;height:80px;font-size:18px}.cover.lg{width:104px;height:140px;font-size:28px}
.body{display:flex;flex-direction:column;min-width:0;text-align:left;cursor:pointer;border-radius:var(--r-sm)}
.body h3{margin:0;font-size:15px;line-height:20px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.body h3 span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ti{width:16px!important;height:16px!important;margin-top:2px;color:var(--accent)}.ti.draft{color:var(--draft)}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--text-2)}
.meta svg{width:13px;height:13px;fill:var(--star);stroke:var(--star)}
.meta b{color:var(--text);font-weight:500}
.sub{font-size:13px;line-height:18px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.badges{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:auto;padding-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--text-2)}
.chip svg{width:12px;height:12px;stroke-width:2.5}
.chip.planned{background:var(--planned-bg);color:var(--planned)}.chip.seen{background:var(--seen-bg);color:var(--seen)}
.chip.err{background:var(--danger-bg);color:var(--danger)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.acts{display:flex;flex-direction:column;gap:0;align-items:center}
.act{width:44px;height:54px;display:grid;place-items:center;color:var(--text-2)}
.act svg{width:24px;height:24px}
.act.fav[aria-pressed=true]{color:var(--fav)}.act.fav[aria-pressed=true] svg{fill:var(--fav)}
.act.seen[aria-pressed=true]{color:var(--seen)}
.act:active svg{transform:scale(.88)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warn);display:inline-block}
/* states */
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 32px}
.state .art{width:72px;height:72px;border-radius:36px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);margin-bottom:8px}
.state .art svg{width:32px;height:32px}
.state h2{margin:0;font-size:20px;line-height:26px;font-weight:600}.state p{margin:0;color:var(--text-2);max-width:300px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:600;font-size:16px;background:var(--accent);color:var(--on-accent);margin-top:12px}
.btn.sec{background:var(--surface-2);color:var(--text)}.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.skel{height:128px;border-radius:var(--r-card);background:linear-gradient(90deg,var(--surface) 0 30%,var(--surface-2) 50%,var(--surface) 70%) 0 0/300% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
/* fab + tabbar */
.fab{position:absolute;right:16px;bottom:calc(49px + env(safe-area-inset-bottom) + 16px);width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px #0004;z-index:6}
.fab svg{width:26px;height:26px;stroke-width:2.5}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:7;display:flex;padding-bottom:env(safe-area-inset-bottom);background:var(--tab-bg);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:.5px solid var(--separator)}
.tab{flex:1;min-width:0;height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:12px;color:var(--text-2);padding:0 2px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:24px;height:24px}.tab[aria-current=page]{color:var(--accent)}.tab[aria-disabled=true]{opacity:.5}
/* sheets */
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);opacity:0;transition:opacity .28s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;display:flex;flex-direction:column;max-height:calc(100% - env(safe-area-inset-top) - 10px);background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translateY(100%);transition:transform .32s var(--ease);box-shadow:0 -8px 30px #0003}
.sheet.full{height:calc(100% - env(safe-area-inset-top) - 10px)}
.open{opacity:1}.sheet.open{transform:none;opacity:1}
.grab{width:36px;height:5px;border-radius:3px;background:var(--separator);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 8px 4px 16px;min-height:52px;flex:none}
.sheet-h h2{margin:0;font-size:17px;font-weight:600;text-align:center;flex:1}
.sheet-h .txt{min-width:64px;height:44px;padding:0 8px;font-size:16px;color:var(--accent);font-weight:500}
.sheet-h .txt[disabled]{color:var(--text-2);opacity:.6}
.sheet-b{overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));flex:1}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden;margin:8px 0 16px}
.glabel{font-size:13px;line-height:18px;color:var(--text-2);text-transform:uppercase;letter-spacing:.3px;margin:16px 16px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;text-align:left;border-top:.5px solid var(--separator)}
.row:first-child{border-top:0}.row .grow{flex:1;min-width:0}.row small{display:block;color:var(--text-2);font-size:13px;line-height:18px}
.row .val{color:var(--text-2);font-size:15px;text-align:right;max-width:50%}
.tri{width:28px;height:28px;border-radius:8px;border:2px solid var(--text-2);display:grid;place-items:center;flex:none;color:var(--on-accent)}
.tri svg{width:18px;height:18px;stroke-width:3}
.tri[data-s="1"]{background:var(--accent);border-color:var(--accent)}
.tri[data-s="2"]{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.trival{font-size:14px;color:var(--text-2);min-width:48px;text-align:right}
.trival[data-s="1"]{color:var(--accent);font-weight:600}.trival[data-s="2"]{color:var(--danger);font-weight:600}
.radio{width:24px;color:var(--accent)}
/* results */
.res{display:grid;grid-template-columns:60px 1fr 44px;gap:10px;align-items:center;width:100%;padding:10px 12px;text-align:left;border-top:.5px solid var(--separator);min-height:80px}
.res:first-child{border-top:0}.res[disabled]{opacity:.6}.res h3{margin:0;font-size:15px;line-height:20px;font-weight:600}
.res .tick{color:var(--seen)}
.hint{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px;padding:12px 4px 0}
.draftrow{background:var(--surface);border-radius:var(--r-md);margin-top:8px}
.field{width:100%;height:48px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--separator);background:var(--bg);color:var(--text);font:16px var(--font)}
.field.bad{border-color:var(--danger)}
.msg{font-size:13px;line-height:18px;margin:6px 0 0}.msg.err{color:var(--danger)}.msg.ok{color:var(--seen)}
.desc{white-space:pre-wrap;font-size:16px;line-height:24px;overflow-wrap:anywhere}
.det{display:flex;gap:14px;padding:8px 0 16px}.det h2{margin:0 0 4px;font-size:22px;line-height:28px;font-weight:700;overflow-wrap:anywhere}
.det .acts2{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface-2);font-size:14px;font-weight:600}
.pill[aria-pressed=true].f{color:var(--fav)}.pill[aria-pressed=true].f svg{fill:var(--fav)}.pill[aria-pressed=true].s{color:var(--seen)}
.pill.d{color:var(--danger)}
.toast{position:absolute;left:16px;right:16px;bottom:calc(49px + env(safe-area-inset-bottom) + 84px);z-index:30;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;min-height:48px;border-radius:var(--r-md);background:var(--text);color:var(--bg);font-size:15px;animation:tin .22s var(--ease)}
.toast.err{background:var(--danger);color:#fff}
:root[data-theme=dark] .toast.err{color:#2a0707}
.toast button{margin-left:auto;min-width:56px;min-height:44px;font-weight:700;color:inherit;text-decoration:underline}
.toast.sheetlvl{bottom:calc(env(safe-area-inset-bottom) + 24px)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

const DEF=()=>({fav:0,seen:2,draft:0,ended:0,type:'all',sort:'title',q:''});
const S={books:DEF(),movies:DEF()};
const coll=new Intl.Collator(lang);

/* ===== routing: #base~state/sheet:arg ===== */
let cur={};
function parse(){
  const h=location.hash.slice(1)||'books';const [main,sheetRaw]=h.split('/');const [base,state]=main.split('~');
  const [sheet,arg]=(sheetRaw||'').split(':');
  return {base:['books','movies','settings'].includes(base)?base:'books',state:state||'',sheet:sheet||'',arg:arg||''};
}
function go(base,state,sheet,arg){location.hash=base+(state?'~'+state:'')+(sheet?'/'+sheet+(arg?':'+arg:''):'')}
const sheetGo=(s,a)=>go(cur.base,cur.state,s,a);

/* ===== filtering ===== */
function visible(kind){
  const f=S[kind];const q=f.q.trim().toLowerCase();
  const items=cur.state==='empty'?[]:DB[kind];
  const m=(v,s)=>s===0||(s===1?v:!v);
  const out=items.filter(i=>m(i.fav,f.fav)&&m(i.st==='seen',f.seen)&&m(i.draft,f.draft)
    &&(kind==='books'||f.type==='all'||(f.type==='tv'?i.type==='tv':i.type!=='tv'))
    &&(f.type!=='tv'||f.ended===0||m(i.tv&&i.tv.s==='ended',f.ended))
    &&(!q||i.t.toLowerCase().includes(q)));
  out.sort(f.sort==='title'?(a,b)=>coll.compare(a.t,b.t)||a.id.localeCompare(b.id):(a,b)=>(b.u||0)-(a.u||0));
  return {out,total:items.length};
}
const activeN=k=>{const f=S[k];return (f.fav?1:0)+(f.seen?1:0)+(f.draft?1:0)+(f.type!=='all'?1:0)+(f.type==='tv'&&f.ended?1:0)};
const countLabel=(n,tot)=>tot===0?'':(n!==tot?t('of',{n,t:tot}):String(tot));
let tick=1;const touch=i=>i.u=tick++;

/* ===== card ===== */
const coverHtml=(i,c='')=>`<div class="cover ${c}" style="background:${i.h?`linear-gradient(150deg,hsl(${i.h} 55% 38%),hsl(${(i.h+40)%360} 60% 22%))`:'var(--surface-2)'};${i.h?'':'color:var(--text-2)'}">${i.h?esc(i.t.slice(0,2)):ic(cur.base==='books'?'book':'film')}</div>`;
function typeIcon(i,kind){return ic(kind==='books'?'book':i.type==='tv'?'tv':'film','ti'+(i.draft?' draft':''))}
function card(i,kind){
  const extra=i.tv?`<div class="sub">${t('statusLine',{s:t(i.tv.s==='ended'?'endedS':'ongoing'),n:i.tv.n})}</div>`:'';
  const done=i.st==='seen';
  return `<div class="swipe" data-id="${i.id}"><article class="card">
  <button class="cover-btn" data-act="src" data-id="${i.id}" aria-label="${t('openSource')}: ${esc(i.src)}" style="width:80px;height:108px">${coverHtml(i)}</button>
  <div class="body" role="button" tabindex="0" data-act="detail" data-id="${i.id}">
    <h3>${typeIcon(i,kind)}<span>${esc(i.t)}</span></h3>
    <div class="meta"><span>${i.y||'—'}</span>${ic('star')}<b>${fmtR(i.r)}</b></div>
    ${kind==='books'?`<div class="sub">${esc(i.a||t('noAuthor'))}</div>`:''}${extra}
    <div class="badges"><span class="chip ${done?'seen':'planned'}">${ic(done?'check':'clock')}${t(done?'seen':'planned')}</span><span class="chip">${esc(i.src)}</span>${i.pend?'<span class="chip warn"><span class="dot"></span></span>':''}</div>
  </div>
  <div class="acts">
    <button class="act fav" data-act="fav" data-id="${i.id}" aria-pressed="${i.fav}" aria-label="${t('fav')}">${ic('heart')}</button>
    <button class="act seen" data-act="seen" data-id="${i.id}" aria-pressed="${done}" aria-label="${t('seenF')}">${ic('eye')}</button>
  </div></article>
  <button class="del" data-act="del" data-id="${i.id}">${ic('trash')}${t('del')}</button></div>`;
}

/* ===== banners ===== */
function banner(){
  const s=cur.state;
  if(s==='offline')return `<div class="banner warn" role="status">${ic('wifioff')}<div class="grow"><b>${t('offline')}</b><br>${t('offlineB')}</div></div>`;
  if(s==='pending')return `<div class="banner info" role="status">${ic('sync','spin')}<div class="grow">${t('pending',{n:3})}</div></div>`;
  if(s==='syncerror')return `<div class="banner err" role="alert">${ic('alert')}<div class="grow">${t('syncErr',{n:2})}</div><button class="btn-s" data-act="retry">${t('retry')}</button></div>`;
  return '';
}

/* ===== pages ===== */
function tabbar(){
  const tab=(id,ico,label,dis)=>dis?`<button class="tab" aria-disabled="true" tabindex="-1">${ic(ico)}<span>${t(label)}</span></button>`:`<button class="tab" data-go="${id}" ${cur.base===id?'aria-current="page"':''}>${ic(ico)}<span>${t(label)}</span></button>`;
  return `<nav class="tabbar" aria-label="Main">${tab('books','book','books')}${tab('movies','film','movies')}${tab('rem','bell','reminders',true)}${tab('settings','gear','settings')}</nav>`;
}
function listPage(kind){
  const f=S[kind];const n=activeN(kind);
  const typeSeg=kind==='movies'?`<div class="seg" role="group" aria-label="Type">${['all','movie','tv'].map(v=>`<button data-act="type" data-v="${v}" aria-pressed="${(f.type==='movie'?'movie':f.type)===v||(v==='all'&&f.type==='all')}">${t(v==='all'?'all':v==='movie'?'mov':'tv')}</button>`).join('')}</div>`:'';
  return `<div class="scroll" id="scroll">${banner()}
  <div class="title-row"><h1>${t(kind)}</h1><span class="count" id="count" aria-live="polite"></span></div>
  <div class="tools"><label class="search">${ic('search')}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="${t('ph')}" value="${esc(f.q)}" aria-label="${t('search')}"></label>
  <button class="ibtn ${n?'on':''}" data-act="sheet" data-v="filters" aria-label="${t('filters')}">${ic('filter')}${n?`<span class="badge">${n}</span>`:''}</button>
  <button class="ibtn" data-act="sheet" data-v="sort" aria-label="${t('sort')}">${ic('sort')}</button></div>
  ${typeSeg}<div id="list"></div></div>
  <button class="fab" data-act="sheet" data-v="add" aria-label="${t(kind==='books'?'addBook':'addMovie')}">${ic('plus')}</button>`;
}
function fillList(){
  const kind=cur.base;const el=document.getElementById('list');if(!el)return;
  const {out,total}=visible(kind);
  document.getElementById('count').textContent=cur.state==='loading'||cur.state==='error'?'':countLabel(out.length,total);
  if(cur.state==='loading'){el.innerHTML='<div class="list" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';return}
  if(cur.state==='error'){el.innerHTML=`<div class="state"><div class="art">${ic('alert')}</div><h2>${t('loadErrT')}</h2><p>${t('loadErrB')}</p><button class="btn" data-act="retry">${ic('sync')}${t('retry')}</button></div>`;return}
  if(total===0){el.innerHTML=`<div class="state"><div class="art">${ic(kind==='books'?'book':'film')}</div><h2>${t(kind==='books'?'emptyBooksT':'emptyMoviesT')}</h2><p>${t(kind==='books'?'emptyBooksB':'emptyMoviesB')}</p><button class="btn" data-act="sheet" data-v="add">${ic('plus')}${t(kind==='books'?'addBook':'addMovie')}</button></div>`;return}
  if(!out.length){el.innerHTML=`<div class="state"><div class="art">${ic('search')}</div><h2>${t('nomatchT')}</h2><p>${t('nomatchB')}</p><button class="btn sec" data-act="reset">${t('reset')}</button></div>`;return}
  el.innerHTML=`<div class="list">${out.map(i=>card(i,kind)).join('')}</div>`;
}
function triRow(key,label){
  const s=S[cur.base][key];
  return `<button class="row" data-act="tri" data-k="${key}" role="checkbox" aria-checked="${s===0?'false':s===1?'true':'mixed'}"><span class="tri" data-s="${s}">${s===1?ic('check'):s===2?ic('minus'):''}</span><span class="grow">${label}</span><span class="trival" data-s="${s}">${t(['any','only','hide'][s])}</span></button>`;
}
function filtersSheet(){
  const kind=cur.base,f=S[kind];const {out,total}=visible(kind);
  return `<div class="sheet-h"><button class="txt" data-act="reset">${t('reset')}</button><h2>${t('filters')}</h2><button class="txt" data-act="close" style="text-align:right">${t('seen')}</button></div>
  <div class="sheet-b"><div class="group">${triRow('fav',t('fav'))}${triRow('seen',t('seenF'))}${triRow('draft',t('draft'))}${kind==='movies'&&f.type==='tv'?triRow('ended',t('ended')):''}</div>
  <button class="btn block" data-act="close" style="margin-top:0">${t('show',{n:out.length,t:total})}</button></div>`;
}
function sortSheet(){
  const f=S[cur.base];
  const r=(v,l)=>`<button class="row" data-act="sort" data-v="${v}" role="radio" aria-checked="${f.sort===v}"><span class="grow">${l}</span><span class="radio">${f.sort===v?ic('check'):''}</span></button>`;
  return `<div class="sheet-h"><span style="min-width:64px"></span><h2>${t('sort')}</h2><button class="txt" data-act="close" style="text-align:right">${t('seen')}</button></div>
  <div class="sheet-b"><div class="group">${r('title',t('byTitle'))}${r('updated',t('byUpdated'))}</div></div>`;
}
function detailSheet(){
  const kind=cur.base;const i=DB[kind].find(x=>x.id===cur.arg);if(!i)return '';
  const done=i.st==='seen';
  return `<div class="sheet-h"><span style="min-width:64px"></span><h2></h2><button class="txt" data-act="close" style="text-align:right">${t('close')}</button></div>
  <div class="sheet-b"><div class="det">${coverHtml(i,'lg')}<div style="min-width:0"><h2>${esc(i.t)}</h2>
  <div class="meta"><span>${i.y||'—'}</span>${ic('star')}<b>${fmtR(i.r)}</b></div>${kind==='books'?`<div class="sub" style="-webkit-line-clamp:3">${esc(i.a||t('noAuthor'))}</div>`:''}
  ${i.tv?`<div class="sub">${t('statusLine',{s:t(i.tv.s==='ended'?'endedS':'ongoing'),n:i.tv.n})}</div>`:''}
  <div class="badges"><span class="chip ${done?'seen':'planned'}">${ic(done?'check':'clock')}${t(done?'seen':'planned')}</span><span class="chip">${esc(i.src)}</span></div></div></div>
  <div class="desc">${i.d?esc(i.d):`<span style="color:var(--text-2)">${t('noDesc')}</span>`}</div>
  <div class="acts2"><button class="pill f" data-act="fav" data-id="${i.id}" aria-pressed="${i.fav}">${ic('heart')}${t('fav')}</button>
  <button class="pill s" data-act="seen" data-id="${i.id}" aria-pressed="${done}">${ic('eye')}${t('seenF')}</button>
  <button class="pill" data-act="src" data-id="${i.id}">${ic('ext')}${t('openSource')}</button>
  <button class="pill d" data-act="del" data-id="${i.id}">${ic('trash')}${t('del')}</button></div></div>`;
}
let addQ='',addBusy=false,addTimer;
function addSheet(){
  const kind=cur.base;const ttl=t(kind==='books'?'addTitleB':'addTitleM');
  const src=kind==='books'?'Open Library':'TMDb';
  const noTok=kind==='movies'&&cur.state==='notoken';const off=cur.state==='offline';
  const blocked=noTok||off;
  return `<div class="sheet-h"><span style="min-width:64px"></span><h2>${ttl}</h2><button class="txt" data-act="close" style="text-align:right">${t('close')}</button></div>
  <div class="sheet-b"><label class="search" style="margin-top:4px">${ic('search')}<input id="aq" type="search" enterkeyhint="search" autocomplete="off" placeholder="${t('phAdd')}" value="${esc(addQ)}" aria-label="${t('phAdd')}"></label>
  ${blocked?'':`<div class="hint">${ic('search')}${t('searchingIn',{s:src})}</div>`}
  ${off?`<div class="banner warn" style="margin:12px 0 0">${ic('wifioff')}<div class="grow">${t('addOffline')}</div></div>`:''}
  ${noTok?`<div class="state" style="padding:24px 8px 8px"><div class="art">${ic('search')}</div><h2>${t('noTokenT')}</h2><p>${t('noTokenB')}</p><button class="btn sec" data-go="settings">${t('goSettings')}</button></div>`:''}
  <div id="results"></div></div>`;
}
function fillResults(){
  const el=document.getElementById('results');if(!el)return;
  const kind=cur.base;const q=addQ.trim();const noTok=kind==='movies'&&cur.state==='notoken';const off=cur.state==='offline';
  let html='';
  if(!(noTok||off)){
    if(q.length<3)html=`<div class="hint">${q.length?t('min3'):''}</div>`;
    else if(addBusy)html=`<div class="hint">${ic('sync','spin')}${t('syncNow')}</div>`;
    else if(cur.state==='error')html=`<div class="toast err sheetlvl" role="alert">${ic('alert')}${t('searchErr')}</div>`;
    else{
      const hits=CAT[kind].filter(c=>c[0].toLowerCase().includes(q.toLowerCase()));
      const inLib=h=>DB[kind].some(i=>i.t===h[0]&&!i.draft);
      html=hits.length?`<div class="group">${hits.map((h,ix)=>{const lib=inLib(h);const tv=h[4]==='tv';
        return `<button class="res" ${lib?'disabled':''} data-act="addres" data-ix="${ix}">${coverHtml({t:h[0],h:(h[0].length*37)%360},'sm')}<div style="min-width:0"><h3>${esc(h[0])}</h3><div class="meta"><span>${h[2]}</span>${ic('star')}<b>${fmtR(h[3])}</b></div><div class="sub">${esc(h[1])}</div></div><span class="tick" aria-label="${t('inLib')}">${lib?ic('check'):''}</span></button>`}).join('')}</div>`:`<div class="hint">${t('noRes')}</div>`;
    }
  }
  if(q.length>=1||noTok||off)html+=`<div class="glabel">${t('cant')}</div><div class="draftrow"><button class="res" style="grid-template-columns:60px 1fr;min-height:64px" ${q?'':'disabled'} data-act="adddraft"><div class="cover sm" style="background:var(--surface-2);color:var(--text-2);height:60px;border-radius:30px;width:60px">${ic('plus')}</div><div style="min-width:0"><h3>${q?t('draftAdd',{q:esc(q)}):t('draftAdd',{q:'…'})}</h3><div class="sub">${t('draftNote')}</div></div></button></div>`;
  el.innerHTML=html;
}
function settingsPage(){
  const s=cur.state;const tokOK=s!=='notoken';
  const notif=s==='denied'?['notifDenied','err']:s==='notinstalled'?['notifOff','']:s==='enabled'||!s?['notifOn','seen']:['notifOff',''];
  const stepsOpen=s==='notinstalled'?'open':'';
  return `<div class="scroll"><div class="title-row"><h1>${t('settings')}</h1></div>${banner()}
  <div style="padding:0 16px 8px">
  <div class="glabel" style="margin-left:4px">${t('sources')}</div><div class="group">
    <div class="row"><span class="grow"><b style="font-weight:600">TMDb</b><small>${t('moviesG')}</small></span><span class="chip ${tokOK?'seen':'warn'}">${ic(tokOK?'check':'alert')}${t(tokOK?'tokenSaved':'tokenMissing')}</span></div>
    <div class="row" style="display:block;padding:12px 16px"><input class="field" id="tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${tokOK?'•'.repeat(20):t('tokenPh')}" aria-label="TMDb API key"><div id="tokmsg" class="msg"></div>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-act="savetok" style="margin:0;flex:1">${t('save')}</button>${tokOK?`<button class="btn sec" data-act="deltok" style="margin:0;flex:1;color:var(--danger)">${t('remove')}</button>`:''}</div>
      <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener" style="display:flex;align-items:center;min-height:44px;color:var(--accent);font-weight:500;margin-top:4px">${t('howKey')}</a></div>
    <div class="row"><span class="grow"><b style="font-weight:600">Open Library</b><small>${t('booksG')}</small></span><span class="val">${t('noTokenReq')}</span></div></div>
  <div class="glabel" style="margin-left:4px">${t('notif')}</div><div class="group">
    <div class="row"><span class="grow">${t('notif')}</span><span class="chip ${notif[1]}">${t(notif[0])}</span></div>
    ${s==='denied'?`<div class="row"><span class="grow" style="color:var(--text-2);font-size:14px;line-height:19px">${t('notifDeniedB')}</span></div>`:''}
    ${s==='notinstalled'?`<div class="row"><span class="grow" style="color:var(--text-2);font-size:14px;line-height:19px">${t('notifNotInst')}</span></div>`:''}
    ${s==='notinstalled'||s==='denied'||s==='enabled'||!s?'':`<div class="row" style="display:block"><button class="btn block" style="margin:0">${ic('bell')}${t('notifEnable')}</button></div>`}
    <details class="row" style="display:block;padding:0" ${stepsOpen}><summary style="display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;list-style:none;cursor:pointer"><span class="grow">${t('install')}</span>${ic('chev')}</summary>
      <ol style="margin:0;padding:0 16px 14px 36px;color:var(--text-2);font-size:15px;line-height:22px"><li>${t('s1')}</li><li>${t('s2')}</li><li>${t('s3')}</li></ol></details></div>
  <div class="glabel" style="margin-left:4px">${t('lang')}</div><div class="group"><div class="row"><span class="grow" style="color:var(--text-2);font-size:14px;line-height:19px">${t('langNote')}</span></div>
    <div class="row"><span class="grow">${t('tz')}</span><span class="val">Europe/Kyiv</span></div></div>
  <div class="glabel" style="margin-left:4px">${t('data')}</div><div class="group"><button class="row"><span class="grow">${t('export')}</span>${ic('chev')}</button></div>
  <div class="glabel" style="margin-left:4px">${t('about')}</div><div class="group"><div class="row"><span class="grow">${t('version')}</span><span class="val">0.1.0</span></div><button class="row" style="color:var(--danger);font-weight:600"><span class="grow">${t('signOut')}</span></button></div>
  <div class="glabel" style="margin-left:4px">${t('proto')}</div><div class="group"><button class="row" data-act="theme"><span class="grow">${t('theme')}</span><span class="val" id="themeval"></span></button></div>
  </div></div>`;
}

/* ===== render ===== */
let lastSheetKey='';
function render(){
  cur=parse();const app=document.getElementById('app');
  const sheetKey=cur.sheet+':'+cur.arg;
  const wasSheet=lastSheetKey!==':'&&lastSheetKey!=='';
  const page=cur.base==='settings'?settingsPage():listPage(cur.base);
  let sheet='';
  if(cur.sheet){
    const inner=cur.sheet==='filters'?filtersSheet():cur.sheet==='sort'?sortSheet():cur.sheet==='detail'?detailSheet():cur.sheet==='add'?addSheet():'';
    sheet=`<div class="scrim" data-act="close"></div><div class="sheet ${cur.sheet==='add'?'full':''}" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;
  }
  const keep=app.querySelector('.scroll')?app.querySelector('.scroll').scrollTop:0;
  app.innerHTML=page+tabbar()+sheet;
  const sc=app.querySelector('.scroll');if(sc&&!sheetChanged)sc.scrollTop=keep;
  fillList();if(cur.sheet==='add')fillResults();
  const th=document.getElementById('themeval');if(th)th.textContent=document.documentElement.dataset.theme||'system';
  const sh=app.querySelector('.sheet');
  if(sh){const sc2=app.querySelector('.scrim');if(wasSheet&&!reopen){sh.classList.add('open');sc2.classList.add('open')}else requestAnimationFrame(()=>requestAnimationFrame(()=>{sh.classList.add('open');sc2.classList.add('open')}))}
  if(cur.sheet==='add'&&focusAdd){focusAdd=false;const a=document.getElementById('aq');a&&a.focus()}
  lastSheetKey=cur.sheet?sheetKey:'';sheetChanged=false;reopen=false;
}
let sheetChanged=false,reopen=false,focusAdd=false;
window.addEventListener('hashchange',()=>{const p=parse();sheetChanged=true;reopen=(p.sheet+':'+p.arg)!==lastSheetKey;if(p.sheet==='add'){addQ='';focusAdd=true}toastClear();render()});

/* ===== toasts ===== */
let toastT;
function toast(msg,undoFn){
  toastClear();const d=document.createElement('div');d.className='toast'+(cur.sheet?' sheetlvl':'');d.setAttribute('role','status');d.id='toast';
  d.innerHTML=`<span>${esc(msg)}</span>${undoFn?`<button>${t('undo')}</button>`:''}`;
  document.getElementById('app').appendChild(d);
  if(undoFn)d.querySelector('button').onclick=()=>{undoFn();toastClear()};
  toastT=setTimeout(toastClear,4000);
}
function toastClear(){clearTimeout(toastT);const d=document.getElementById('toast');d&&d.remove()}

/* ===== events ===== */
const app=document.getElementById('app');
const find=id=>DB[cur.base].find(i=>i.id===id);
function refresh(){ // re-render keeping focus-sensitive inputs intact
  const open=cur.sheet;const sc=app.querySelector('.scroll');const top=sc?sc.scrollTop:0;
  render();const s2=app.querySelector('.scroll');if(s2)s2.scrollTop=top;
}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const id=g.dataset.go;if(id!=='rem')go(id);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,kind=cur.base,f=S[kind];
  if(a==='close'){go(cur.base,cur.state);return}
  if(a==='sheet'){if(el.dataset.v==='add'){addQ='';focusAdd=true}sheetGo(el.dataset.v);return}
  if(a==='detail'){sheetGo('detail',id);return}
  if(a==='fav'){const i=find(id);i.fav=!i.fav;touch(i);refresh();return}
  if(a==='seen'){const i=find(id);i.st=i.st==='seen'?'planned':'seen';touch(i);
    const sw=app.querySelector(`.swipe[data-id="${id}"]`);
    const hides=S[kind].seen===2&&i.st==='seen';
    if(sw&&hides&&!cur.sheet){sw.classList.add('gone');setTimeout(refresh,230)}else refresh();return}
  if(a==='src'){const i=find(id);const u=i.draft?'https://google.com/search?q='+encodeURIComponent(i.t):'#';toast(i.draft?'google.com/search?q='+i.t:i.src+' → '+(kind==='books'?'openlibrary.org/works/':'themoviedb.org/')+(i.id));return}
  if(a==='del'){const i=find(id);const idx=DB[kind].indexOf(i);
    const sw=app.querySelector(`.swipe[data-id="${id}"]`);const fin=()=>{DB[kind].splice(idx,1);if(cur.sheet)go(cur.base,cur.state);else refresh();toast(t('deleted'),()=>{DB[kind].splice(idx,0,i);refresh()})};
    if(sw&&!cur.sheet){sw.classList.add('gone');setTimeout(fin,220)}else fin();return}
  if(a==='tri'){const k=el.dataset.k;f[k]=(f[k]+1)%3;const y=app.querySelector('.sheet-b').scrollTop;refresh();return}
  if(a==='reset'){S[kind]=DEF();refresh();return}
  if(a==='sort'){f.sort=el.dataset.v;refresh();return}
  if(a==='type'){const v=el.dataset.v;f.type=f.type===v?'all':v;if(f.type!=='tv')f.ended=0;refresh();return}
  if(a==='retry'){if(cur.state==='error'||cur.state==='syncerror'||cur.state==='offline')go(cur.base);else refresh();return}
  if(a==='addres'){const h=CAT[kind].filter(c=>c[0].toLowerCase().includes(addQ.trim().toLowerCase()))[+el.dataset.ix];
    const n={id:'n'+Date.now(),t:h[0],a:h[1],y:h[2],r:h[3],src:kind==='books'?'Open Library':'TMDb',h:(h[0].length*37)%360,d:'Fetched on add (description, better cover, credits).'};
    if(kind==='movies'){n.type=h[4];if(h[4]==='tv')n.tv={s:'ongoing',n:1}}
    touch(n);DB[kind].push(n);go(cur.base,cur.state);setTimeout(()=>toast(t('added')+': '+h[0]),50);return}
  if(a==='adddraft'){const n={id:'n'+Date.now(),t:addQ.trim(),draft:true,src:'Draft',h:0};if(kind==='movies')n.type='movie';touch(n);DB[kind].push(n);go(cur.base,cur.state);setTimeout(()=>toast(t('added')+': '+n.t),50);return}
  if(a==='theme'){const r=document.documentElement;const nx={undefined:'dark',dark:'light',light:'dark'}[r.dataset.theme];r.dataset.theme=nx;refresh();return}
  if(a==='savetok'){const v=document.getElementById('tok').value.trim();const m=document.getElementById('tokmsg');const inp=document.getElementById('tok');
    if(!v){m.className='msg';m.textContent='';return}
    if(v.length<8){inp.classList.add('bad');m.className='msg err';m.textContent=t('tokenBad')}else{inp.classList.remove('bad');m.className='msg ok';m.textContent=t('tokenOk');inp.value=''}return}
  if(a==='deltok'){go('settings','notoken');return}
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.body[role=button]')){e.preventDefault();e.target.click()}});
app.addEventListener('input',e=>{
  if(e.target.id==='q'){S[cur.base].q=e.target.value;fillList()}
  if(e.target.id==='aq'){addQ=e.target.value;clearTimeout(addTimer);addBusy=addQ.trim().length>=3&&!cur.state;fillResults();if(addBusy)addTimer=setTimeout(()=>{addBusy=false;fillResults()},500)}
});
window.addEventListener('hashchange',()=>{});
render();
</script>
</body>
</html>
