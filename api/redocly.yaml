extends:
  - recommended

rules:
  # revisit when identity-github-oauth lands
  operation-4xx-response: off
  security-defined: off
  # the GitHub login endpoints answer with 302 redirects only
  operation-2xx-response: off
  # BookSourceId and MovieSourceId are generated into the backend model (draft refs; the media module in Phase 3 uses them)
  # although no operation references them yet
  no-unused-components: off
  # private project, no license
  info-license: off
