openapi: 3.0.3
info:
  title: RWX API
  version: 0.1.0
  description: |
    Single source of truth for the RWX server interfaces and the TypeScript client.
    Server interfaces are generated (openapi-generator); TS client types are generated (openapi-typescript).
    OpenAPI-first: never hand-duplicate API contracts.

    Authentication: GitHub OAuth only. A successful login sets the opaque session cookie `SESSION` (see the cookieAuth scheme); every endpoint except the GitHub login redirects (the browser starts at Spring's `/oauth2/authorization/github`, which is not part of this contract, and returns on `/auth/github/callback`) and the actuator probes needs it, otherwise the response is 401. CSRF: every mutating request (POST, PUT, PATCH, DELETE) must carry the header `X-XSRF-TOKEN` with the value of the readable `XSRF-TOKEN` cookie (double-submit); a missing or wrong token is 403 with code `csrf` and nothing changes. GET requests need no token. The API is same-origin, so there is no CORS.

servers:
  - url: /
    description: Same origin (the Spring jar serves the SPA and the API)

tags:
  - name: auth
    description: Authentication (GitHub OAuth)
  - name: settings
    description: User account and preferences
  - name: data-sources
    description: The user's data sources per resource type (books, movies and TV), with availability, the chosen default and API keys for sources that need one (write-only, never returned)
  - name: books
    description: Books (add, list, edit, delete)
  - name: movies
    description: Movies and TV shows (add, list, edit, delete)
  - name: search
    description: Keyword search over the data sources (Open Library for books, TMDb for movies and TV), with canonical source URLs
  - name: me
    description: Current user

paths:
  # ===== BOOKS =====
  /api/v1/books:
    get:
      tags: [books]
      operationId: listBooks
      summary: List user's books
      description: All live books of the user as a bare array. No filter, sort or paging parameters; the client filters and sorts over its cached full list (media spec).
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [books]
      operationId: createBook
      summary: Add a book from a source URL (provider item or draft)
      description: |
        The request is `{id, sourceUrl}` and nothing else: the client UUID and the `sourceUrl` of the entry the user picked in the add sheet. The server decides everything else.
        The server never fetches the URL it was given. It recognizes the source from the URL (the identity, in any pasted form, comes from the URL itself) and then reads the item from the provider on its own configured address, which spends one details token (429 `rate_limited`). Provider items store the provider's fields and the canonical `externalLink`; failures create nothing (409 `source_key_missing`/`source_key_invalid` with `source`, 422 `source_not_found`, 502, 503 with `Retry-After`, 504) and the same id can be retried.
        The draft source (a `https://www.google.com/search?q=<text>` link) fetches nothing: only the `q` parameter is read (decoded, NFC, trimmed, 1..200 characters, no control characters); the stored title is that text and the stored `externalLink` is the rebuilt canonical search URL. A URL no source recognizes (or whose content is invalid) is 400 `validation` on `sourceUrl`.
        Status and favorite are not part of create: a new book is `planned` and not favorite (change them with PATCH).
        Idempotent by id: a live book with the same id returns 200 with the stored item before the URL is recognized (the body must still be valid: a `sourceUrl` that is not an http(s) URL is 400; what it names is ignored).
        A provider item already held (same source and id) or whose ISBN another live book holds is 409 `duplicate` with `existingId` (the same-item case before any provider call). A draft with the same trimmed case-insensitive title as any live book is 409 `duplicate` with `existingId`.
        An id that was deleted returns 410 `gone` and recreates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '200':
          description: A live book with this id already exists; returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateOrConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/books/{id}:
    get:
      tags: [books]
      operationId: getBook
      summary: Get book details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [books]
      operationId: updateBook
      summary: Update book status or favorite
      description: Unknown or another user's id is 404; a deleted id is 410. Identical content changes neither `version` nor `updatedAt`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

    delete:
      tags: [books]
      operationId: deleteBook
      summary: Delete book
      description: Tombstones the book. Idempotent (deleting a deleted book is 204); an unknown or another user's id is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Book deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== MOVIES =====
  /api/v1/movies:
    get:
      tags: [movies]
      operationId: listMovies
      summary: List user's movies and TV shows
      description: All live items of the user as a bare array. No filter, sort or paging parameters; the client filters and sorts over its cached full list (media spec).
      responses:
        '200':
          description: List of movies/shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movie'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [movies]
      operationId: createMovie
      summary: Add a movie from a source URL (provider item or draft)
      description: |
        The request is `{id, sourceUrl}` and nothing else (no title, no type): the client UUID and the `sourceUrl` of the entry the user picked in the add sheet. The server decides everything else.
        The server never fetches the URL it was given. It recognizes the source from the URL (the identity, in any pasted form, comes from the URL itself; a TMDb movie and tv URL with the same number are different items) and then reads the item from the provider on its own configured address, which spends one details token (429 `rate_limited`). Provider items store the provider's fields and the canonical `externalLink`; failures create nothing (409 `source_key_missing`/`source_key_invalid` with `source`, 422 `source_not_found`, 502, 503 with `Retry-After`, 504) and the same id can be retried.
        The draft source (a `https://www.google.com/search?q=<text>` link, title = the text, type `movie`) fetches nothing: only the `q` parameter is read (decoded, NFC, trimmed, 1..200 characters, no control characters); the stored `externalLink` is the rebuilt canonical search URL. A URL no source recognizes (or whose content is invalid) is 400 `validation` on `sourceUrl`.
        Status and favorite are not part of create: a new item is `planned` and not favorite (change them with PATCH).
        Idempotent by id: a live item with the same id returns 200 with the stored item before the URL is recognized (the body must still be valid: a `sourceUrl` that is not an http(s) URL is 400; what it names is ignored).
        A provider item already held (same source, type and id; movie 1396 and tv 1396 are different items) is 409 `duplicate` with `existingId`, before any provider call. A draft with the same trimmed case-insensitive title as any live item (title or original title) is 409 `duplicate` with `existingId`.
        An id that was deleted returns 410 `gone` and recreates nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMovieRequest'
      responses:
        '200':
          description: A live item with this id already exists; returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '201':
          description: Movie/show created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateOrConflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/movies/{id}:
    get:
      tags: [movies]
      operationId: getMovie
      summary: Get movie or TV show details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Movie/show details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [movies]
      operationId: updateMovie
      summary: Update movie or TV show status, favorite or TV series data
      description: |
        `seasonCount` and `tvStatus` are the write path of the TV refresh and are accepted for `tv` items only (400 otherwise).
        Unknown or another user's id is 404; a deleted id is 410. Identical content changes neither `version` nor `updatedAt`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMovieRequest'
      responses:
        '200':
          description: Movie/show updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Movie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'

    delete:
      tags: [movies]
      operationId: deleteMovie
      summary: Delete movie or TV show
      description: Tombstones the item. Idempotent (deleting a deleted item is 204); an unknown or another user's id is 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Movie/show deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== SETTINGS =====
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get user settings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Update settings (timezone, locale)
      description: Partial update of the user's single settings record; at least one property is required. An unknown IANA zone is 400 `invalid_timezone`; an empty body or an invalid locale is 400 `validation`. Nothing changes on error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/github/callback:
    get:
      tags: [auth]
      operationId: githubLoginCallback
      summary: GitHub login callback
      description: |
        Registered as the OAuth App callback URL (local dev: `http://localhost:8080/api/v1/auth/github/callback`). Browser navigation (the login starts at `/oauth2/authorization/github`, served by Spring Security and outside this contract). Validates `state`, exchanges the code server-side with the client secret, finds or creates the user (open sign-up), starts the session and sets the `SESSION` cookie. The GitHub access token is discarded.
        Success: 302 to `/`. Any failure (user cancelled, account disabled, bad or missing `state`, GitHub error) is one generic 302 to `/login?error` with no reason; no session is started.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by GitHub when the user denies access
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the SPA (`/` on success, `/login?error` on any failure)
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              schema:
                type: string
              description: SESSION cookie on success only

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout and clear session
      description: Invalidates the session server-side, expires the `SESSION` cookie and returns 204. Idempotent, so without a valid session it also returns 204 (the client can always call it to reach a clean state). Needs the CSRF header when a session exists.
      responses:
        '204':
          description: Logged out
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===== ME =====
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get the current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the current account
      description: Permanently deletes the user and all of the user's data (cascade) and ends the session. Not reversible.
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/export:
    get:
      tags: [me]
      operationId: exportMe
      summary: Export all data of the current account
      description: Machine-readable copy of everything the user owns (profile, settings, chosen default data sources, books and movies; reminders join the export in their phase) as a JSON download. Never includes a data source API key or session data.
      responses:
        '200':
          description: Account data
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment with a dated file name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===== DATA SOURCES =====
  /api/v1/data-sources:
    get:
      tags: [data-sources]
      operationId: listDataSources
      summary: List the data sources per resource type with the user's default, availability and whether a key is saved
      description: |
        One ordered list per resource type (`books`, `movies`), in the server's configuration order. The configured default of the type is stored for every user at creation; a key row exists only for a saved key.
        Per source: `isDefault` is the user's stored default (the configured default until the user picks another), exactly one per list; `available` says whether the source is usable by this user now (a source that needs a key is unavailable until the user saves one); `isEffective` marks the one source a search without a `source` parameter uses: the default when it is available, otherwise the first available source in list order, and when none is available the default itself (its search then answers `source_key_missing`). The stored default is never changed by this fallback. A client shows a source selector only when a list has two or more registered sources.
        No response carries a key or any part of it.
      responses:
        '200':
          description: Data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/data-sources/{resourceType}/{source}/default:
    put:
      tags: [data-sources]
      operationId: setDefaultDataSource
      summary: Make a source the user's default for its resource type
      description: |
        Idempotent. The previous default of this type stops being it; at most one default per user and type. Allowed for any registered source of the type, available or not: an unavailable default is kept and the search falls back to the first available source until the key is saved (`isEffective` in the list). Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/data-sources/{resourceType}/{source}/key:
    put:
      tags: [data-sources]
      operationId: saveDataSourceKey
      summary: Save (or replace) the user's API key for a source that needs one
      description: |
        Only for a source that has `requiresKey` (otherwise 404 `not_found`). The source validates the key with its provider first: accepted means stored; rejected is 422 `source_key_rejected` (with the source named in `Problem.source`) and nothing is stored, a previously saved key stays; a provider failure is 502 or 504 and nothing is stored; a key that breaks the source's format is 400 `validation`. Saving again replaces the key. Saving a key does not change the default. The key is write-only: never returned, never logged. Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDataSourceKeyRequest'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      tags: [data-sources]
      operationId: deleteDataSourceKey
      summary: Delete the user's API key of a source
      description: |
        Idempotent (no key saved is a no-op). Only for a source with `requiresKey` (otherwise 404 `not_found`). If the source is the user's default, the choice is kept: the source becomes unavailable and `isEffective` moves to the first available source (the stored default is not changed, so saving a key again restores it). Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== SEARCH =====
  /api/v1/search/books:
    get:
      tags: [search]
      operationId: searchBooks
      summary: Search books by keyword in a book source (at most 10 provider hits, then one draft entry)
      description: |
        Calls the selected source upstream (the `source` parameter, else the user's effective source from `GET /data-sources`) and returns the parsed hits in the source's order, each with a canonical server-generated `sourceUrl`. The list ALWAYS ends with exactly one extra entry of kind `draft` carrying the typed text (title = trimmed text, `sourceUrl` = the Google search link built from it), below the provider hits; with no provider hits it is the only entry. A provider failure is an error response and no list (the client builds the same draft entry locally).
        "Already in library" is not computed here: the client compares `sourceUrl` with its items' `externalLink` (and the draft entry by normalized title).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchBookSourceId'
      responses:
        '200':
          description: Hits, then the draft entry
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 11
                items:
                  $ref: '#/components/schemas/BookSearchHit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/search/movies:
    get:
      tags: [search]
      operationId: searchMovies
      summary: Search movies and TV by keyword in a movie source (at most 10 provider hits, then one draft entry)
      description: |
        As `GET /search/books` for the movie sources (TMDb: movies and series mixed, persons dropped). TMDb needs the user's API key (409 `source_key_missing` or `source_key_invalid` otherwise, `Problem.source` names the source). The list ALWAYS ends with exactly one `draft` entry (title = trimmed text, `sourceUrl` = the Google search link, no `type`).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchMovieSourceId'
      responses:
        '200':
          description: Hits, then the draft entry
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 11
                items:
                  $ref: '#/components/schemas/MovieSearchHit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/search/books/details:
    get:
      tags: [search]
      operationId: getBookDetails
      summary: Preview the normalized book a source URL would be stored as
      description: |
        By `sourceUrl` (the same input as `POST /books`, so the preview cannot drift from what create stores; it also works for a pasted provider URL and does not expose provider ids). The URL is recognized and canonicalized by the server and never fetched. A draft URL has no details; it and any URL no source recognizes are 400 `validation` with `errors[0].field` `sourceUrl`. Provider 404 is 404 `not_found` here (create answers 422 `source_not_found`).
      parameters:
        - $ref: '#/components/parameters/SourceUrlQuery'
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/search/movies/details:
    get:
      tags: [search]
      operationId: getMovieDetails
      summary: Preview the normalized movie or TV item a source URL would be stored as
      description: |
        As `GET /search/books/details` for movie sources; the type (movie or tv) comes from the URL. Needs the user's TMDb API key (409 `source_key_missing` or `source_key_invalid` otherwise). Also the TV refresh read path: the client passes the stored `externalLink`.
      parameters:
        - $ref: '#/components/parameters/SourceUrlQuery'
      responses:
        '200':
          description: Movie or TV details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  schemas:
    # ===== COMMON =====
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: |
            Stable machine-readable code. Used so far:
            validation (schema or field rule violated, incl. empty PATCH body and invalid locale; see errors; also a `sourceUrl` that no source of the resource recognizes, a wrong-type or draft link on the details endpoints, or a draft link with a missing, too long or control-character `q`; the URL is never echoed),
            invalid_timezone (/settings: zone not in the IANA list),
            duplicate (409 on create, see existingId),
            not_found (404, unknown id or another user's id; also a source that is not of the resource type on the /data-sources paths),
            gone (410, the id was deleted),
            csrf (403, missing or invalid X-XSRF-TOKEN on a mutating request),
            source_key_missing, source_key_invalid, source_key_rejected, source_not_found,
            provider_error, provider_rate_limited, provider_timeout, rate_limited.
            The source codes are not tied to one data source: `source_key_missing` (409, the source needs an API key the user has not saved), `source_key_invalid` (409, the provider rejected the saved key on use; the key is kept), `source_key_rejected` (422 on PUT /data-sources/{resourceType}/{source}/key, the provider rejected the submitted key; nothing stored). The source they are about is named in `source`.
            The provider codes come from the resolver machinery when the server calls a provider (key validation today; search, details and create in later phases): source_not_found (422, the provider has no such item), rate_limited (429), provider_error (502; 503 when our outbound capacity is exhausted), provider_rate_limited (503 + Retry-After), provider_timeout (504).
        existingId:
          type: string
          format: uuid
          description: Set with code duplicate (409), the id of the live item that already holds this content
        source:
          allOf:
            - $ref: '#/components/schemas/DataSourceId'
          description: The data source the problem is about. Set with source_key_missing, source_key_invalid, source_key_rejected, source_not_found, provider_error, provider_rate_limited and provider_timeout; absent for every other code (rate_limited is our own limit and names no source). The client names the source in its message from this member, never by parsing `detail`.
        errors:
          type: array
          description: Field-level validation errors
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    # ===== SOURCES =====
    BookSourceId:
      type: string
      enum: [draft, open_library]
      description: |
        Source of a book: `open_library` (Open Library works) or `draft` (the user's typed text, nothing fetched). Closed per resource type, so a TMDb id can never be a book source; the movie counterpart is `MovieSourceId`. Adding a book source means adding a value here (plus the `user_default_sources` CHECK constraint, the `user_source_keys` one if it needs a key, and a server registry entry); clients show a label for an id they do not know with the id as the fallback.

    MovieSourceId:
      type: string
      enum: [draft, tmdb]
      description: |
        Source of a movie or tv item: `tmdb` or `draft` (the user's typed text, nothing fetched). Closed per resource type, so an Open Library id can never be a movie source; the book counterpart is `BookSourceId`. Adding a movie source means adding a value here (plus the `user_default_sources` CHECK constraint, the `user_source_keys` one if it needs a key, and a server registry entry); clients show a label for an id they do not know with the id as the fallback.

    BookSearchSourceId:
      type: string
      enum: [open_library]
      description: A searchable book source, `BookSourceId` without `draft` (never a registered search source; `source=draft` on a search is 400 `validation`).

    MovieSearchSourceId:
      type: string
      enum: [tmdb]
      description: A searchable movie source, `MovieSourceId` without `draft` (never a registered search source; `source=draft` on a search is 400 `validation`).

    DataSourceId:
      type: string
      enum: [open_library, tmdb]
      description: A registered data source of any resource type (`BookSourceId` and `MovieSourceId` without `draft`). Which resource type it belongs to is the registry's (`open_library` is a book source, `tmdb` a movie source); a pair that does not match is 404 on the `/data-sources/{resourceType}/{source}/...` paths. Adding a source adds a value here and to the per-resource enums.

    ResourceType:
      type: string
      enum: [book, movie]
      description: The resource a data source serves; `movie` covers TV series too. Same values as the `resource_type` column.

    # ===== BOOKS =====
    Book:
      type: object
      required: [id, userId, title, source, externalId, externalLink, status, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 5
          description: Source (Open Library) average; 0 or absent = unknown. Not user-editable.
        status:
          type: string
          enum: [planned, seen]
        isFavorite:
          type: boolean
        description:
          type: string
        coverUrl:
          type: string
          format: uri
        isbn:
          type: string
          description: Normalized ISBN (no hyphens or spaces, uppercase X), normalized by the server from the provider's value. Absent for drafts. Immutable.
        source:
          allOf:
            - $ref: '#/components/schemas/BookSourceId'
          description: |
            Where the item came from: `open_library` or `draft` for a book. Immutable. Together with `externalId` it is the identity used for duplicate detection; the UI shows it as a badge (`draft` is translated by the client, a provider id maps to its name). A client treats an item as a draft exactly when `source` is `draft`.
        externalId:
          type: string
          minLength: 1
          maxLength: 1024
          description: Always present. For a provider item the provider's id (Open Library work id, OL<digits>W), extracted by the server from the source URL. For a draft (`source` `draft`) the normalized text (the title in Unicode NFC, trimmed and case-folded), so the draft duplicate rule is the same unique key as for provider items. Informational for clients (rely on `source` and `externalLink`). Immutable.
        externalLink:
          type: string
          format: uri
          description: |
            Canonical source URL generated by the server, always https, never copied from the client: the Open Library work page `https://openlibrary.org/works/<id>`, or for a draft the Google web-search link `https://www.google.com/search?q=<percent-encoded title>` (a draft has no provider page; the link is not a provider identity). The same string is the `sourceUrl` the client sends for a draft, so "already in library" is string equality. Open it only if it parses as https. Immutable.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CreateBookRequest:
      type: object
      description: |
        Create request: the client UUID and the `sourceUrl` of the picked search entry (or a pasted provider page URL). Nothing else is accepted or stored from the client; the server recognizes the source from the URL, resolves it and fills every field of `Book` itself. 
      required: [id, sourceUrl]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated record id
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 4096
          x-field-extra-annotation: '@com.javanix.rwx.common.validators.HttpUrl'
          description: |
            Canonical `sourceUrl` of the picked entry. Recognition and canonicalization are the server's (the draft `https://www.google.com/search?q=<text>`, only `q` read). Must be an http(s) URL with a host (400 `validation` otherwise); anything the server cannot recognize is also 400 `validation` on `sourceUrl`. It is never fetched.

    UpdateBookRequest:
      type: object
      properties:
        status:
          type: string
          enum: [planned, seen]
        isFavorite:
          type: boolean
        version:
          type: integer
          format: int64
          description: Client's base version (informational). Last write wins, a stale value is still applied.

    # ===== MOVIES =====
    Movie:
      type: object
      required: [id, userId, title, type, source, externalId, externalLink, status, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        title:
          type: string
        originalTitle:
          type: string
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Source (TMDb) average; 0 or absent = unknown. Not user-editable.
        type:
          type: string
          enum: [movie, tv]
          description: Immutable
        seasonCount:
          type: integer
          description: TV only
        tvStatus:
          type: string
          enum: [ongoing, ended]
          description: TV only; absent when unknown. TMDb Ended and Canceled map to ended
        status:
          type: string
          enum: [planned, seen]
        isFavorite:
          type: boolean
        description:
          type: string
        posterUrl:
          type: string
          format: uri
        source:
          allOf:
            - $ref: '#/components/schemas/MovieSourceId'
          description: |
            Where the item came from: `tmdb` or `draft` for a movie or tv item. Immutable. Together with `type` and `externalId` it is the identity used for duplicate detection. A client treats an item as a draft exactly when `source` is `draft`.
        externalId:
          type: string
          minLength: 1
          maxLength: 1024
          description: Always present. For a provider item the TMDb id (digits), extracted by the server from the source URL. For a draft (`source` `draft`, type `movie`) the normalized text (the title in Unicode NFC, trimmed and case-folded). Informational for clients. Immutable.
        externalLink:
          type: string
          format: uri
          description: |
            Canonical source URL generated by the server, always https: the TMDb page `https://www.themoviedb.org/movie/<id>` or `/tv/<id>`, or for a draft the Google web-search link `https://www.google.com/search?q=<percent-encoded title>` (not a provider identity). The same string is the `sourceUrl` the client sends for a draft (duplicate detection by string equality). Open it only if it parses as https. Immutable.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CreateMovieRequest:
      type: object
      description: |
        Create request: the client UUID and the `sourceUrl` of the picked search entry (or a pasted provider page URL). No title, no type, no provider id: the movie or tv type comes from the URL and the server fills every field of `Movie`. 
      required: [id, sourceUrl]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated record id
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 4096
          x-field-extra-annotation: '@com.javanix.rwx.common.validators.HttpUrl'
          description: |
            Canonical `sourceUrl` of the picked entry (the draft `https://www.google.com/search?q=<text>`). Anything the server cannot recognize is 400 `validation` on `sourceUrl`. It is never fetched.

    UpdateMovieRequest:
      type: object
      properties:
        status:
          type: string
          enum: [planned, seen]
        isFavorite:
          type: boolean
        seasonCount:
          type: integer
          minimum: 0
          description: TV items only (TV refresh)
        tvStatus:
          type: string
          enum: [ongoing, ended]
          description: TV items only (TV refresh). A null status from TMDb is never sent (the stored value is kept)
        version:
          type: integer
          format: int64
          description: Client's base version (informational). Last write wins, a stale value is still applied.


    # ===== SETTINGS =====
    UiLocale:
      type: string
      enum: [en, ru, uk]
      description: Supported UI languages; the one list shared by the settings record, PATCH /settings and the sign-up choice.

    UserSettings:
      type: object
      required: [userId, timeZone, locale, createdAt, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        timeZone:
          type: string
          description: IANA timezone, e.g., "Europe/London"
        locale:
          allOf:
            - $ref: '#/components/schemas/UiLocale'
          description: UI language. Fixed at sign-up from the browser's Accept-Language (first of en, ru, uk by quality, else en); changed only by PATCH. Never null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SaveDataSourceKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: Write-only, never returned or logged. Its format is the source's own rule (TMDb takes 20 to 512 characters of letters, digits, `.`, `_`, `-`, a v4 read access token or a v3 key), a violation is 400 `validation` with the field `apiKey`. Stored as is for now (no encryption yet; owner decision, AES-GCM may be added later).

    UpdateSettingsRequest:
      type: object
      minProperties: 1
      properties:
        timeZone:
          type: string
          description: IANA timezone, e.g., "Europe/London"
        locale:
          $ref: '#/components/schemas/UiLocale'

    # ===== ME =====
    Me:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: From the credential metadata (GitHub name, falling back to the login)
        avatarUrl:
          type: string
          format: uri
          nullable: true

    AccountExport:
      type: object
      required: [exportedAt, user, settings, dataSources, books, movies]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
        settings:
          $ref: '#/components/schemas/UserSettings'
        dataSources:
          type: array
          description: The user's chosen default data sources (no API keys, ever)
          items:
            $ref: '#/components/schemas/DefaultDataSource'
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        movies:
          type: array
          items:
            $ref: '#/components/schemas/Movie'

    DataSources:
      type: object
      description: The registered data sources per resource type. Each list is ordered (server configuration).
      required: [books, movies]
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
        movies:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'

    DataSource:
      type: object
      description: One registered data source as seen by the signed-in user. Carries no key and no part of one.
      required: [id, label, requiresKey, isDefault, isEffective, available, tokenSaved]
      properties:
        id:
          $ref: '#/components/schemas/DataSourceId'
        label:
          type: string
          description: Display name (`Open Library`, `TMDb`); a proper name, not translated
        requiresKey:
          type: boolean
          description: True when the user must save an API key before the source is usable (TMDb); the key operations answer 404 for a source with false
        isDefault:
          type: boolean
          description: True for the user's stored default of this list (the configured default until the user picks another). Exactly one per list. Kept when the source is unavailable.
        isEffective:
          type: boolean
          description: True for the one source a search without `source` uses (the default if available, else the first available in list order, else the default). Exactly one per list. The client's "searching in" line and preselection.
        available:
          type: boolean
          description: Usable by this user now; false while a required key is missing
        tokenSaved:
          type: boolean
          description: Whether the user has saved a key for this source; always false when `requiresKey` is false

    DefaultDataSource:
      type: object
      description: The user's chosen default source of one resource type (a preference like the settings; never a key). One per resource type, stored at sign-up.
      required: [resourceType, source]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        source:
          $ref: '#/components/schemas/DataSourceId'


    # ===== SEARCH =====
    BookSearchHit:
      type: object
      description: |
        One entry of a book search. `kind` provider: a parsed hit of the selected source. `kind` draft: the typed text as an addable draft, always the last entry (only `kind`, `sourceUrl` and `title` are set). No provider id is exposed (a provider hit carries at most an optional `isbn`); `sourceUrl` is the identity the client sends back on create.
      required: [kind, sourceUrl, title]
      properties:
        kind:
          type: string
          enum: [provider, draft]
        sourceUrl:
          type: string
          format: uri
          description: Canonical URL generated by the server (provider page in its canonical form, or the Google search link of the typed text for a draft). Sent back as `sourceUrl` of `POST /books`; equal to `Book.externalLink` of the stored item. Render a link only if it parses as https.
        title:
          type: string
        author:
          type: string
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 5
        coverUrl:
          type: string
          format: uri
        isbn:
          type: string
          description: Provider hits only; optional. The first non-blank ISBN the provider returns for the work, as the provider gives it (not validated or normalized). Lets the client mark an ISBN duplicate of a library book (in addition to `sourceUrl` equality, after its own normalization). Absent when the provider returns none and on the draft entry.

    MovieSearchHit:
      type: object
      description: |
        One entry of a movie search. `kind` provider: a parsed hit (movie or tv). `kind` draft: the typed text as an addable draft, always the last entry (only `kind`, `sourceUrl` and `title` are set; the stored type is `movie`).
      required: [kind, sourceUrl, title]
      properties:
        kind:
          type: string
          enum: [provider, draft]
        sourceUrl:
          type: string
          format: uri
          description: Canonical URL generated by the server (TMDb movie or tv page, or the Google search link of the typed text for a draft). Sent back as `sourceUrl` of `POST /movies`; equal to `Movie.externalLink` of the stored item. Render a link only if it parses as https.
        type:
          type: string
          enum: [movie, tv]
          description: Provider hits only
        title:
          type: string
        originalTitle:
          type: string
        description:
          type: string
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 10
        posterUrl:
          type: string
          format: uri

    BookDetails:
      type: object
      description: The same normalized record the server stores when a book is created from this source URL (the add-sheet preview); the client never sends these values back.
      required: [title, externalLink]
      properties:
        title:
          type: string
        author:
          type: string
        description:
          type: string
        coverUrl:
          type: string
          format: uri
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 5
        isbn:
          type: string
          description: The first non-blank ISBN the provider returns, as the provider gives it (not validated or normalized; create normalizes it before storing). Absent when none
        externalLink:
          type: string
          format: uri
          description: Canonical source URL (equal to what create stores)

    MovieDetails:
      type: object
      description: The same normalized record the server stores when an item is created from this source URL (the add-sheet preview); the client never sends these values back.
      required: [type, title, externalLink]
      properties:
        type:
          type: string
          enum: [movie, tv]
          description: Taken from the URL
        title:
          type: string
        originalTitle:
          type: string
        description:
          type: string
        posterUrl:
          type: string
          format: uri
        year:
          type: integer
        rating:
          type: number
          minimum: 0
          maximum: 10
        tvStatus:
          type: string
          enum: [ongoing, ended]
          description: TV only. Ended and Canceled map to ended; absent when unknown
        seasonCount:
          type: integer
          description: TV only
        externalLink:
          type: string
          format: uri
          description: Canonical source URL (equal to what create stores)

  parameters:
    SearchQuery:
      name: q
      in: query
      required: true
      description: Keyword text. After trimming and NFC it must be 3 to 200 code points without control characters (checked by the server, 400 `validation` otherwise)
      schema:
        type: string
    SearchBookSourceId:
      name: source
      in: query
      required: false
      description: Source id from `GET /data-sources` for this type; omitted = the user's effective source (`isEffective`). An id that is not an enum value, is `draft` or of another type, or is not in the list of this type is 400 `validation`; an unavailable source answers with its own problem (409 `source_key_missing`).
      schema:
        $ref: '#/components/schemas/BookSearchSourceId'
    SearchMovieSourceId:
      name: source
      in: query
      required: false
      description: Source id from `GET /data-sources` for this type; omitted = the user's effective source (`isEffective`). An id that is not an enum value, is `draft` or of another type, or is not in the list of this type is 400 `validation`; an unavailable source answers with its own problem (409 `source_key_missing`).
      schema:
        $ref: '#/components/schemas/MovieSearchSourceId'
    DataSourceResourceType:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    DataSourceIdPath:
      name: source
      in: path
      required: true
      description: A registered source of the resource type; a valid id that is not a source of that type is 404 `not_found`, a value that is not an enum value is 400 `validation`
      schema:
        $ref: '#/components/schemas/DataSourceId'
    SourceUrlQuery:
      name: sourceUrl
      in: query
      required: true
      description: Canonical `sourceUrl` of a search hit, a stored item's `externalLink`, or a pasted provider page URL. Recognized and canonicalized by the server, never fetched. Must be an http(s) URL with a host of 1 to 4096 characters (400 `validation` otherwise; checked by the server, like `q`).
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request (validation, with errors[]; includes a sourceUrl that no source of the resource recognizes, or a draft link on the details endpoints)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: Forbidden (code csrf - missing or invalid X-XSRF-TOKEN; nothing changed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Conflict:
      description: Conflict (source_key_missing or source_key_invalid, with `source`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    DuplicateOrConflict:
      description: Duplicate (code duplicate; existingId is the id of the live item that already holds this content), or the source needs a key (source_key_missing, source_key_invalid, with `source`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Gone:
      description: The id was deleted (code gone); nothing is recreated or changed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnprocessableEntity:
      description: Unprocessable (source_key_rejected when saving a source key; source_not_found when creating from a provider item the provider does not have)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limited (rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    BadGateway:
      description: Provider error (provider_error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: Provider rate limited (provider_rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    GatewayTimeout:
      description: Provider timeout (provider_timeout)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Opaque server-side session id (Spring Session JDBC, HttpOnly, SameSite=Lax, Secure except on localhost), set by the GitHub login callback; 30-day rolling idle timeout.
        Mutating requests also need the CSRF header X-XSRF-TOKEN (double-submit with the readable XSRF-TOKEN cookie); a missing or wrong token is 403 `csrf`.

security:
  - cookieAuth: []
