openapi: 3.0.3
info:
  title: RWX API
  version: 0.1.0
  description: |
    Single source of truth for the RWX server interfaces and the TypeScript client.
    Server interfaces are generated (openapi-generator); TS client types are generated (openapi-typescript).
    OpenAPI-first: never hand-duplicate API contracts.

    Authentication: GitHub OAuth only. A successful login sets the opaque session cookie `SESSION` (see the cookieAuth scheme); every endpoint except the GitHub login redirects (the browser starts at Spring's `/oauth2/authorization/github`, which is not part of this contract, and returns on `/auth/github/callback`) and the actuator probes needs it, otherwise the response is 401. CSRF: every mutating request (POST, PUT, PATCH, DELETE) must carry the header `X-XSRF-TOKEN` with the value of the readable `XSRF-TOKEN` cookie (double-submit); a missing or wrong token is 403 with code `csrf` and nothing changes. GET requests need no token. The API is same-origin, so there is no CORS.

servers:
  - url: /
    description: Same origin (the Spring jar serves the SPA and the API)

tags:
  - name: auth
    description: Authentication (GitHub OAuth)
  - name: settings
    description: User account and preferences
  - name: data-sources
    description: The user's data sources per resource type (books, movies and TV), with availability, the chosen default and API keys for sources that need one (write-only, never returned)
  - name: me
    description: Current user

paths:
  # ===== SETTINGS =====
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get user settings
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Update settings (timezone, locale)
      description: Partial update of the user's single settings record; at least one property is required. An unknown IANA zone is 400 `invalid_timezone`; an empty body or an invalid locale is 400 `validation`. Nothing changes on error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/github/callback:
    get:
      tags: [auth]
      operationId: githubLoginCallback
      summary: GitHub login callback
      description: |
        Registered as the OAuth App callback URL (local dev: `http://localhost:8080/api/v1/auth/github/callback`). Browser navigation (the login starts at `/oauth2/authorization/github`, served by Spring Security and outside this contract). Validates `state`, exchanges the code server-side with the client secret, finds or creates the user (open sign-up), starts the session and sets the `SESSION` cookie. The GitHub access token is discarded.
        Success: 302 to `/`. Any failure (user cancelled, account disabled, bad or missing `state`, GitHub error) is one generic 302 to `/login?error` with no reason; no session is started.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by GitHub when the user denies access
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the SPA (`/` on success, `/login?error` on any failure)
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              schema:
                type: string
              description: SESSION cookie on success only

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout and clear session
      description: Invalidates the session server-side, expires the `SESSION` cookie and returns 204. Idempotent, so without a valid session it also returns 204 (the client can always call it to reach a clean state). Needs the CSRF header when a session exists.
      responses:
        '204':
          description: Logged out
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===== ME =====
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Get the current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the current account
      description: Permanently deletes the user and all of the user's data (cascade) and ends the session. Not reversible.
      responses:
        '204':
          description: Account deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/me/export:
    get:
      tags: [me]
      operationId: exportMe
      summary: Export all data of the current account
      description: Machine-readable copy of everything the user owns (profile, settings, chosen default data sources; media and reminders join the export in their phases) as a JSON download. Never includes a data source API key or session data.
      responses:
        '200':
          description: Account data
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment with a dated file name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===== DATA SOURCES =====
  /api/v1/data-sources:
    get:
      tags: [data-sources]
      operationId: listDataSources
      summary: List the data sources per resource type with the user's default, availability and whether a key is saved
      description: |
        One ordered list per resource type (`books`, `movies`), in the server's configuration order. The configured default of the type is stored for every user at creation; a key row exists only for a saved key.
        Per source: `isDefault` is the user's stored default (the configured default until the user picks another), exactly one per list; `available` says whether the source is usable by this user now (a source that needs a key is unavailable until the user saves one); `isEffective` marks the one source a search without a `source` parameter uses: the default when it is available, otherwise the first available source in list order, and when none is available the default itself (its search then answers `source_key_missing`). The stored default is never changed by this fallback. A client shows a source selector only when a list has two or more registered sources.
        No response carries a key or any part of it.
      responses:
        '200':
          description: Data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/data-sources/{resourceType}/{source}/default:
    put:
      tags: [data-sources]
      operationId: setDefaultDataSource
      summary: Make a source the user's default for its resource type
      description: |
        Idempotent. The previous default of this type stops being it; at most one default per user and type. Allowed for any registered source of the type, available or not: an unavailable default is kept and the search falls back to the first available source until the key is saved (`isEffective` in the list). Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/data-sources/{resourceType}/{source}/key:
    put:
      tags: [data-sources]
      operationId: saveDataSourceKey
      summary: Save (or replace) the user's API key for a source that needs one
      description: |
        Only for a source that has `requiresKey` (otherwise 404 `not_found`). The source validates the key with its provider first: accepted means stored; rejected is 422 `source_key_rejected` (with the source named in `Problem.source`) and nothing is stored, a previously saved key stays; a provider failure is 502 or 504 and nothing is stored; a key that breaks the source's format is 400 `validation`. Saving again replaces the key. Saving a key does not change the default. The key is write-only: never returned, never logged. Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDataSourceKeyRequest'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      tags: [data-sources]
      operationId: deleteDataSourceKey
      summary: Delete the user's API key of a source
      description: |
        Idempotent (no key saved is a no-op). Only for a source with `requiresKey` (otherwise 404 `not_found`). If the source is the user's default, the choice is kept: the source becomes unavailable and `isEffective` moves to the first available source (the stored default is not changed, so saving a key again restores it). Returns the refreshed lists.
      parameters:
        - $ref: '#/components/parameters/DataSourceResourceType'
        - $ref: '#/components/parameters/DataSourceIdPath'
      responses:
        '200':
          description: Data sources after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSources'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    # ===== COMMON =====
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: |
            Stable machine-readable code. Used so far:
            validation (schema or field rule violated, incl. empty PATCH body and invalid locale; see errors),
            invalid_timezone (/settings: zone not in the IANA list),
            not_found (404, unknown id or another user's id; also a source that is not of the resource type on the /data-sources paths),
            csrf (403, missing or invalid X-XSRF-TOKEN on a mutating request),
            source_key_missing, source_key_invalid, source_key_rejected, source_not_found,
            provider_error, provider_rate_limited, provider_timeout, rate_limited.
            The source codes are not tied to one data source: `source_key_missing` (409, the source needs an API key the user has not saved), `source_key_invalid` (409, the provider rejected the saved key on use; the key is kept), `source_key_rejected` (422 on PUT /data-sources/{resourceType}/{source}/key, the provider rejected the submitted key; nothing stored). The source they are about is named in `source`.
            The provider codes come from the resolver machinery when the server calls a provider (key validation today; search, details and create in later phases): source_not_found (422, the provider has no such item), rate_limited (429), provider_error (502; 503 when our outbound capacity is exhausted), provider_rate_limited (503 + Retry-After), provider_timeout (504).
        source:
          allOf:
            - $ref: '#/components/schemas/DataSourceId'
          description: The data source the problem is about. Set with source_key_missing, source_key_invalid, source_key_rejected, source_not_found, provider_error, provider_rate_limited and provider_timeout; absent for every other code (rate_limited is our own limit and names no source). The client names the source in its message from this member, never by parsing `detail`.
        errors:
          type: array
          description: Field-level validation errors
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    # ===== SOURCES =====
    BookSourceId:
      type: string
      enum: [draft, open_library]
      description: |
        Source of a book: `open_library` (Open Library works) or `draft` (the user's typed text, nothing fetched). Closed per resource type, so a TMDb id can never be a book source; the movie counterpart is `MovieSourceId`. Adding a book source means adding a value here (plus the `user_default_sources` CHECK constraint, the `user_source_keys` one if it needs a key, and a server registry entry); clients show a label for an id they do not know with the id as the fallback.

    MovieSourceId:
      type: string
      enum: [draft, tmdb]
      description: |
        Source of a movie or tv item: `tmdb` or `draft` (the user's typed text, nothing fetched). Closed per resource type, so an Open Library id can never be a movie source; the book counterpart is `BookSourceId`. Adding a movie source means adding a value here (plus the `user_default_sources` CHECK constraint, the `user_source_keys` one if it needs a key, and a server registry entry); clients show a label for an id they do not know with the id as the fallback.

    DataSourceId:
      type: string
      enum: [open_library, tmdb]
      description: A registered data source of any resource type (`BookSourceId` and `MovieSourceId` without `draft`). Which resource type it belongs to is the registry's (`open_library` is a book source, `tmdb` a movie source); a pair that does not match is 404 on the `/data-sources/{resourceType}/{source}/...` paths. Adding a source adds a value here and to the per-resource enums.

    ResourceType:
      type: string
      enum: [book, movie]
      description: The resource a data source serves; `movie` covers TV series too. Same values as the `resource_type` column.

    # ===== SETTINGS =====
    UiLocale:
      type: string
      enum: [en, ru, uk]
      description: Supported UI languages; the one list shared by the settings record, PATCH /settings and the sign-up choice.

    UserSettings:
      type: object
      required: [userId, timeZone, locale, createdAt, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        timeZone:
          type: string
          description: IANA timezone, e.g., "Europe/London"
        locale:
          allOf:
            - $ref: '#/components/schemas/UiLocale'
          description: UI language. Fixed at sign-up from the browser's Accept-Language (first of en, ru, uk by quality, else en); changed only by PATCH. Never null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SaveDataSourceKeyRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: Write-only, never returned or logged. Its format is the source's own rule (TMDb takes 20 to 512 characters of letters, digits, `.`, `_`, `-`, a v4 read access token or a v3 key), a violation is 400 `validation` with the field `apiKey`. Stored as is for now (no encryption yet; owner decision, AES-GCM may be added later).

    UpdateSettingsRequest:
      type: object
      minProperties: 1
      properties:
        timeZone:
          type: string
          description: IANA timezone, e.g., "Europe/London"
        locale:
          $ref: '#/components/schemas/UiLocale'

    # ===== ME =====
    Me:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: From the credential metadata (GitHub name, falling back to the login)
        avatarUrl:
          type: string
          format: uri
          nullable: true

    AccountExport:
      type: object
      required: [exportedAt, user, settings, dataSources]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
        settings:
          $ref: '#/components/schemas/UserSettings'
        dataSources:
          type: array
          description: The user's chosen default data sources (no API keys, ever)
          items:
            $ref: '#/components/schemas/DefaultDataSource'

    DataSources:
      type: object
      description: The registered data sources per resource type. Each list is ordered (server configuration).
      required: [books, movies]
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
        movies:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'

    DataSource:
      type: object
      description: One registered data source as seen by the signed-in user. Carries no key and no part of one.
      required: [id, label, requiresKey, isDefault, isEffective, available, tokenSaved]
      properties:
        id:
          $ref: '#/components/schemas/DataSourceId'
        label:
          type: string
          description: Display name (`Open Library`, `TMDb`); a proper name, not translated
        requiresKey:
          type: boolean
          description: True when the user must save an API key before the source is usable (TMDb); the key operations answer 404 for a source with false
        isDefault:
          type: boolean
          description: True for the user's stored default of this list (the configured default until the user picks another). Exactly one per list. Kept when the source is unavailable.
        isEffective:
          type: boolean
          description: True for the one source a search without `source` uses (the default if available, else the first available in list order, else the default). Exactly one per list. The client's "searching in" line and preselection.
        available:
          type: boolean
          description: Usable by this user now; false while a required key is missing
        tokenSaved:
          type: boolean
          description: Whether the user has saved a key for this source; always false when `requiresKey` is false

    DefaultDataSource:
      type: object
      description: The user's chosen default source of one resource type (a preference like the settings; never a key). One per resource type, stored at sign-up.
      required: [resourceType, source]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        source:
          $ref: '#/components/schemas/DataSourceId'


  parameters:
    DataSourceResourceType:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ResourceType'
    DataSourceIdPath:
      name: source
      in: path
      required: true
      description: A registered source of the resource type; a valid id that is not a source of that type is 404 `not_found`, a value that is not an enum value is 400 `validation`
      schema:
        $ref: '#/components/schemas/DataSourceId'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: Forbidden (code csrf - missing or invalid X-XSRF-TOKEN; nothing changed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Unprocessable (source_key_rejected when saving a source key; source_not_found when creating from a provider item the provider does not have)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    TooManyRequests:
      description: Rate limited (rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    BadGateway:
      description: Provider error (provider_error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    ServiceUnavailable:
      description: Provider rate limited (provider_rate_limited)
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    GatewayTimeout:
      description: Provider timeout (provider_timeout)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        Opaque server-side session id (Spring Session JDBC, HttpOnly, SameSite=Lax, Secure except on localhost), set by the GitHub login callback; 30-day rolling idle timeout.
        Mutating requests also need the CSRF header X-XSRF-TOKEN (double-submit with the readable XSRF-TOKEN cookie); a missing or wrong token is 403 `csrf`.

security:
  - cookieAuth: []
